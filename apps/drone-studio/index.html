<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Stüdyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
      /* Kayıt 1080x1920 viewport'ta yapılır; tarayıcı önizlemesinde de aynı oranda ölçeklenir. */
      #stage { position: relative; width: 1080px; height: 1920px; transform-origin: top left; overflow: hidden; }
      #map { position: absolute; inset: 0; }
      gmp-map-3d { width: 100%; height: 100%; }
      /* Üst/alt kenarda yazıların okunması için hafif karartma */
      #vignette { position: absolute; inset: 0; pointer-events: none;
                  background: linear-gradient(to bottom, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 70%, rgba(0,0,0,.32) 100%); }

      .anim { opacity: 0; will-change: opacity, transform; }
      /* Açılış başlığı (kanca): iki satır, kinetik */
      #hook { position: absolute; left: 0; right: 0; top: 230px; text-align: center; pointer-events: none; opacity: 0; }
      #hook .line { font-weight: 900; line-height: .98; letter-spacing: -4px; text-transform: uppercase; will-change: transform, opacity;
                    -webkit-text-stroke: 4px rgba(20,10,4,.55); paint-order: stroke fill; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
      #hook .l0 { font-size: 168px; color: #ffc24d; }
      #hook .l1 { font-size: 112px; color: #fff; margin-top: 6px; }
      /* Konum etiketi (mahalle) */
      #place { position: absolute; left: 70px; right: 70px; top: 190px; text-align: center; pointer-events: none; }
      #place .t { display: inline-block; font-size: 72px; font-weight: 900; color: #fff; padding: 16px 40px; border-radius: 26px;
                  background: rgba(8, 24, 32, .72); border: 4px solid #3fe0ff; box-shadow: 0 0 40px rgba(63,224,255,.45); }
      #place .t::before { content: "📍 "; }
      #place .s { margin-top: 18px; font-size: 44px; font-weight: 800; color: #c9f6ff; text-shadow: 0 3px 14px rgba(0,0,0,.9); }
      /* m² rozeti (tarama sırasında sayar, kapanışta yeniden) */
      #area { position: absolute; left: 0; right: 0; top: 150px; text-align: center; pointer-events: none; }
      #area .num { display: inline-block; font-size: 138px; font-weight: 900; color: #fff; letter-spacing: -3px; font-variant-numeric: tabular-nums;
                   padding: 12px 52px; border-radius: 30px; background: rgba(30, 16, 6, 0.5);
                   border: 5px solid #ffc24d; box-shadow: 0 0 50px rgba(255, 194, 77, 0.6), inset 0 0 22px rgba(255,194,77,.22); }
      #area .sub { margin-top: 18px; font-size: 50px; font-weight: 800; color: #ffd99a; text-shadow: 0 3px 14px rgba(0,0,0,.9); }
      #area .sub:empty { display: none; }
      /* Özellik kutucukları */
      #features { position: absolute; left: 48px; top: 170px; display: flex; flex-direction: column; gap: 22px; pointer-events: none; }
      .chip { display: flex; align-items: center; gap: 22px; padding: 18px 34px 18px 22px; border-radius: 26px; will-change: transform, opacity;
              background: linear-gradient(100deg, rgba(30, 17, 8, .86), rgba(30, 17, 8, .66)); border: 3px solid rgba(255, 194, 77, .9);
              box-shadow: 0 10px 34px rgba(0,0,0,.45), 0 0 26px rgba(255,194,77,.25); }
      .chip .icon { font-size: 62px; line-height: 1; width: 72px; text-align: center; }
      .chip .lbl { font-size: 30px; font-weight: 700; color: rgba(255,255,255,.75); text-transform: uppercase; letter-spacing: 1px; }
      .chip .val { font-size: 54px; font-weight: 900; color: #ffc24d; line-height: 1.05; max-width: 700px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* Seslendirme altyazısı: büyük, kalın, okunan kelime sarı (Reels tarzı) */
      #caption { position: absolute; left: 60px; right: 60px; top: 1180px; display: flex; flex-wrap: wrap; justify-content: center;
                 gap: 0 22px; opacity: 0; pointer-events: none; will-change: opacity, transform; }
      #caption span { font-size: 76px; font-weight: 900; line-height: 1.12; color: #fff; letter-spacing: -1px;
                      -webkit-text-stroke: 3px rgba(0,0,0,.85); paint-order: stroke fill;
                      text-shadow: 0 6px 24px rgba(0,0,0,.75); }
      #caption span.on { color: #ffd166; transform: scale(1.06); display: inline-block; }
      /* Kapanış kartı: ofis adı, telefon, fiyat */
      #endcard { position: absolute; left: 70px; right: 70px; bottom: 170px; padding: 34px 44px; border-radius: 34px; text-align: center;
                 background: rgba(30, 17, 8, 0.84); border: 4px solid #ffc24d; box-shadow: 0 0 44px rgba(255,194,77,.42), 0 18px 50px rgba(0,0,0,.5);
                 pointer-events: none; }
      #endcard .price { font-size: 88px; font-weight: 900; color: #ffc24d; letter-spacing: -2px; }
      #endcard .price:empty, #endcard .office:empty, #endcard .phone:empty { display: none; }
      #endcard .office { font-size: 50px; font-weight: 800; color: #fff; margin-top: 6px; }
      #endcard .phone { font-size: 58px; font-weight: 900; color: #ffd99a; margin-top: 10px; }
      /* Bölüm geçişi: kısa sıcak ışık parlaması */
      #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
               background: radial-gradient(ellipse at 50% 45%, rgba(255, 244, 220, .95) 0%, rgba(255, 196, 100, .72) 45%, rgba(255, 120, 60, .5) 100%); }
      /* Danışman şeridi: ofis + telefon, video boyunca altta */
      #contact { position: absolute; left: 48px; right: 48px; bottom: 64px; display: flex; justify-content: space-between; align-items: center;
                 gap: 24px; padding: 18px 34px; border-radius: 26px; background: rgba(30, 17, 8, 0.76); border: 3px solid rgba(255, 194, 77, .85);
                 box-shadow: 0 10px 34px rgba(0,0,0,.45); pointer-events: none; }
      #contact .office { font-size: 40px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #contact .phone { font-size: 44px; font-weight: 900; color: #ffd99a; white-space: nowrap; }
      #contact .office:empty, #contact .phone:empty { display: none; }
      #attribution { position: absolute; right: 24px; bottom: 18px; font-size: 22px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 4px #000; }
      #status { position: absolute; right: 16px; top: 16px; font: 20px monospace; color: #0f0; background: #000a; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="map"></div>
      <div id="vignette"></div>
      <div id="hook"></div>
      <div id="place" class="anim"><div class="t"></div><div class="s"></div></div>
      <div id="area" class="anim"><div class="num"></div><div class="sub"></div></div>
      <div id="features"></div>
      <div id="caption"></div>
      <div id="endcard" class="anim"><div class="price"></div><div class="office"></div><div class="phone"></div></div>
      <div id="contact" class="anim"><div class="office"></div><div class="phone"></div></div>
      <div id="flash"></div>
      <!-- Google 3D harita görüntüleri atıf zorunlu; logo harita bileşeninin kendisinde de görünür. -->
      <div id="attribution">Görüntüler © Google</div>
      <div id="status">yükleniyor…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
