<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Stüdyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
      /* Kayıt 1080x1920 viewport'ta yapılır; tarayıcı önizlemesinde de aynı oranda ortalanır. */
      #stage { position: relative; width: 1080px; height: 1920px; transform-origin: top left; }
      #map { position: absolute; inset: 0; }
      gmp-map-3d { width: 100%; height: 100%; }
      #overlay { position: absolute; left: 0; right: 0; top: 150px; text-align: center; pointer-events: none;
                 opacity: 0; transform: translateY(24px); transition: none; }
      #overlay .area { display: inline-block; font-size: 120px; font-weight: 900; color: #fff; letter-spacing: -2px;
                       padding: 18px 48px; border-radius: 28px; background: rgba(0, 0, 0, 0.42);
                       border: 4px solid #00e5ff; box-shadow: 0 0 40px rgba(0, 229, 255, 0.55); }
      #overlay .sub { margin-top: 26px; font-size: 52px; font-weight: 800; color: #00e5ff;
                      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.85); }
      #attribution { position: absolute; right: 24px; bottom: 18px; font-size: 22px; color: rgba(255,255,255,0.85);
                     text-shadow: 0 1px 4px #000; }
      #status { position: absolute; right: 16px; top: 16px; font: 20px monospace; color: #0f0; background: #000a; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="map"></div>
      <div id="overlay"><div class="area"></div><div class="sub"></div></div>
      <!-- Google 3D harita görüntüleri atıf zorunlu; logo harita bileşeninin kendisinde de görünür. -->
      <div id="attribution">Görüntüler © Google</div>
      <div id="status">yükleniyor…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
